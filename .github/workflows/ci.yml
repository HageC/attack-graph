name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/api/go.sum
      - run: go test ./...
        working-directory: services/api
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pyyaml
        working-directory: services/simulation
      - run: python -m pytest -q
        working-directory: services/simulation
      - run: python tests/validate_openapi.py services/api/cmd/api/openapi.yaml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - shell: pwsh
        run: ./tests/integration_provisioning.ps1
      - run: docker compose restart api
      - shell: pwsh
        run: ./tests/integration_relationships.ps1
      - shell: pwsh
        run: ./tests/integration_snapshots.ps1
      - shell: pwsh
        run: ./tests/integration_snapshot_lock.ps1
      - shell: pwsh
        run: ./tests/integration_layouts.ps1
      - shell: pwsh
        run: ./tests/integration_simulations.ps1
      - shell: pwsh
        run: ./tests/integration_simulation_jobs.ps1
      - run: go run ../../tests/integration_websocket.go
        working-directory: services/api
      - shell: pwsh
        run: ./tests/integration_detection.ps1
      - shell: pwsh
        run: ./tests/integration_defense.ps1
      - if: always()
        run: docker compose down
