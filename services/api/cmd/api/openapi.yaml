openapi: 3.1.0
info:
  title: AttackGraph API
  version: 0.2.0
  description: Synthetic enterprise graph and attack-path API. Scores are model estimates.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: API process healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /openapi.yaml:
    get:
      security: []
      responses:
        '200':
          description: Current Go API OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200':
          description: Sets an HttpOnly session cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      responses:
        '200':
          description: Current signed-in account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      responses:
        '200': {description: Session revoked}
        '401': {$ref: '#/components/responses/Error'}
  /auth/change-password:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 12, maxLength: 128}
      responses:
        '200': {description: Password changed and all sessions revoked}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments:
    get:
      responses:
        '200':
          description: Environments assigned to the current account.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Environment'}
        '401': {$ref: '#/components/responses/Error'}
  /organizations/{orgID}/users:
    get:
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      responses:
        '200':
          description: Organization users; administrator only.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OrganizationUser'}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 128}
                role: {type: string, enum: [viewer, editor, admin]}
      responses:
        '201':
          description: New account added to the organization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationUser'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /organizations/{orgID}/environments:
    post:
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 2, maxLength: 100}
                description: {type: string, maxLength: 500}
      responses:
        '201':
          description: Empty synthetic environment added to the organization.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Environment'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/graph:
    get:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      responses:
        '200':
          description: Environment graph from Neo4j.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Graph'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/layouts:
    get:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      responses:
        '200':
          description: Named layouts for the environment. The default layout uses asset coordinates in the graph.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/GraphLayout'}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, positions]
              properties:
                name: {type: string, minLength: 2, maxLength: 80}
                positions:
                  type: object
                  maxProperties: 2000
                  additionalProperties: {$ref: '#/components/schemas/LayoutPosition'}
      responses:
        '201':
          description: Named layout created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphLayout'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/layouts/{layoutID}/assets/{assetID}/position:
    patch:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/LayoutID' }, { $ref: '#/components/parameters/AssetID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LayoutPosition'}
      responses:
        '200': {description: Position saved to the named layout only}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/layouts/{layoutID}:
    delete:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/LayoutID' }]
      responses:
        '200': {description: Named layout deleted}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/assets:
    post:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssetInput'}
      responses:
        '201':
          description: Asset created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/assets/{assetID}:
    patch:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/AssetID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssetInput'}
      responses:
        '200':
          description: Asset updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/assets/{assetID}/position:
    patch:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/AssetID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y]
              properties:
                x: {type: integer, minimum: -5000, maximum: 5000}
                y: {type: integer, minimum: -5000, maximum: 5000}
      responses:
        '200': {description: Position saved}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/vulnerabilities:
    get:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      responses:
        '200':
          description: Synthetic vulnerabilities in the environment.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Vulnerability'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VulnerabilityCreate'}
      responses:
        '201':
          description: Vulnerability created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vulnerability'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/vulnerabilities/{vulnerabilityID}:
    patch:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/VulnerabilityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VulnerabilityInput'}
      responses:
        '200': {description: Vulnerability updated}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/vulnerabilities/{vulnerabilityID}/state:
    patch:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/VulnerabilityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [active, mitigated]}
      responses:
        '200': {description: Vulnerability lifecycle state updated}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/snapshots:
    get:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      responses:
        '200':
          description: Immutable graph snapshot metadata ordered by version.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Snapshot'}}
    post:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      responses:
        '201':
          description: Graph and weakness state captured for replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '403': {$ref: '#/components/responses/Error'}
  /environments/{id}/snapshots/{snapshotID}:
    get:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/SnapshotID' }]
      responses:
        '200':
          description: Stored graph and weaknesses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/relationships:
    post:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, target, kind]
              properties:
                source: {type: string}
                target: {type: string}
                kind: {type: string, enum: [CAN_REACH, HAS_ACCESS_TO, TRUSTS, DEPENDS_ON]}
      responses:
        '201': {description: Relationship created}
        '200': {description: Existing relationship returned}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/transitions:
    post:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionInput'}
      responses:
        '201': {description: Modeled transition created}
        '200': {description: Existing transition returned}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/transitions/{transitionID}:
    patch:
      parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/TransitionID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked: {type: boolean}
      responses:
        '200': {description: Modeled transition state updated}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/simulations:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    get:
      summary: List the latest 50 completed synthetic runs for an environment.
      responses:
        '200':
          description: Run summaries, newest first.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SimulationRun'}}
        '404': {$ref: '#/components/responses/Error'}
    post:
      summary: Generate and persist a bounded run from an immutable snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationConfig'}
      responses:
        '201':
          description: Completed run and its event timeline.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /environments/{id}/defense/compare:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    post:
      summary: Compare baseline and proposed modeled controls using paired seeded Monte Carlo runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DefenseComparisonInput'}
      responses:
        '200': {description: Synthetic risk and detection estimates with uncertainty intervals, content: {application/json: {schema: {$ref: '#/components/schemas/DefenseComparison'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /environments/{id}/simulations/{runID}:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/RunID' }]
    get:
      summary: Retrieve a saved run with its event timeline.
      responses:
        '200':
          description: Saved run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/reports/{runID}:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/RunID' }]
    get:
      summary: Generate a reproducible synthetic investigation report for a saved run.
      responses:
        '200': {description: Run timeline, snapshot fingerprint, delivery counts, and alert evidence, content: {application/json: {schema: {$ref: '#/components/schemas/InvestigationReport'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/simulations/{runID}/jobs:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/RunID' }]
    post:
      summary: Start backend delivery of a saved synthetic event timeline.
      responses:
        '201': {description: Job started, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationJob'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /environments/{id}/simulation-jobs:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    get:
      summary: List the latest 50 playback jobs.
      responses:
        '200': {description: Job statuses, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SimulationJob'}}}}}
  /environments/{id}/simulation-jobs/{jobID}:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/JobID' }]
    get:
      summary: Get job state and events delivered so far.
      responses:
        '200': {description: Job state, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationJob'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/simulation-jobs/{jobID}/stream:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/JobID' }]
    get:
      summary: Upgrade to an authenticated, same-origin WebSocket for job state and delivered events.
      description: Sends a state message with the persisted cursor and delivered event prefix on connect, then event messages as the cursor advances and state messages on status or speed changes. Reconnect to recover missed events from the initial state message.
      responses:
        '101': {description: WebSocket upgrade accepted.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/simulation-jobs/{jobID}/{action}:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/JobID' }, { $ref: '#/components/parameters/JobAction' }]
    post:
      summary: Pause, resume, stop, or set delivery speed on an active job.
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {speed: {type: number, enum: [0.5, 1, 2, 4]}}}
      responses:
        '200': {description: Updated job state, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationJob'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/soc/summary:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    get:
      summary: Aggregate delivered synthetic telemetry, adversarial labels, alerts, and active rules.
      responses:
        '200': {description: SOC summary, content: {application/json: {schema: {$ref: '#/components/schemas/SOCSummary'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/telemetry:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    get:
      summary: List delivered synthetic security telemetry.
      parameters:
        - {name: job_id, in: query, schema: {type: string}}
        - {name: run_id, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string}}
        - {name: asset_id, in: query, schema: {type: string}}
        - {name: min_severity, in: query, schema: {type: integer, minimum: 1, maximum: 5}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {description: Telemetry rows, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SecurityTelemetry'}}}}}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/alerts:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    get:
      summary: List alerts created by enabled rules at delivery time.
      parameters:
        - {name: job_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {description: Alert rows, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SecurityAlert'}}}}}
  /environments/{id}/detection-rules:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }]
    get:
      summary: List declarative detection rules.
      responses:
        '200': {description: Detection rules, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DetectionRule'}}}}}
    post:
      summary: Create a rule matching event type, minimum severity, and optional asset.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DetectionRuleInput'}
      responses:
        '201': {description: Rule created, content: {application/json: {schema: {$ref: '#/components/schemas/DetectionRule'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{id}/detection-rules/{ruleID}:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/RuleID' }]
    patch:
      summary: Enable or disable a detection rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}
      responses:
        '200': {description: Updated rule, content: {application/json: {schema: {$ref: '#/components/schemas/DetectionRule'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /environments/{id}/detection-rules/{ruleID}/test:
    parameters: [{ $ref: '#/components/parameters/EnvironmentID' }, { $ref: '#/components/parameters/RuleID' }]
    post:
      summary: Test a rule against already delivered telemetry without creating alerts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {job_id: {type: string}}}
      responses:
        '200':
          description: Match count and up to 100 telemetry IDs.
          content:
            application/json:
              schema: {type: object, required: [rule_id, match_count, telemetry_ids, truncated, enabled], properties: {rule_id: {type: string}, match_count: {type: integer}, telemetry_ids: {type: array, items: {type: string}}, truncated: {type: boolean}, enabled: {type: boolean}}}
        '404': {$ref: '#/components/responses/Error'}
  /attack-paths/analyze:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment_id, start_asset_id, target_asset_id]
              properties:
                environment_id: {type: string}
                snapshot_id: {type: string, description: Optional immutable snapshot to analyze instead of the live graph.}
                start_asset_id: {type: string}
                target_asset_id: {type: string}
                max_depth: {type: integer, minimum: 1, maximum: 12, default: 6}
                initial_capabilities:
                  type: array
                  maxItems: 4
                  items: {type: string, enum: [foothold, identity, operator, service_identity]}
      responses:
        '200':
          description: Feasible modeled paths and scoring note.
          content:
            application/json:
              schema:
                type: object
                required: [paths, score_note]
                properties:
                  paths:
                    type: array
                    items: {$ref: '#/components/schemas/AttackPath'}
                  score_note: {type: string}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: attackgraph_session
  parameters:
    OrganizationID: {name: orgID, in: path, required: true, schema: {type: string}}
    EnvironmentID: {name: id, in: path, required: true, schema: {type: string}}
    LayoutID: {name: layoutID, in: path, required: true, schema: {type: string}}
    AssetID: {name: assetID, in: path, required: true, schema: {type: string}}
    VulnerabilityID: {name: vulnerabilityID, in: path, required: true, schema: {type: string}}
    TransitionID: {name: transitionID, in: path, required: true, schema: {type: string}}
    SnapshotID: {name: snapshotID, in: path, required: true, schema: {type: string}}
    RunID: {name: runID, in: path, required: true, schema: {type: string}}
    JobID: {name: jobID, in: path, required: true, schema: {type: string}}
    JobAction: {name: action, in: path, required: true, schema: {type: string, enum: [pause, resume, stop, speed]}}
    RuleID: {name: ruleID, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Standard error envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    InvestigationReport:
      type: object
      required: [schema_version, environment_id, run_id, snapshot_id, snapshot_hash, seed, config, summary, events, run_created_at, delivered_events, alert_count, alerts, evidence_limit, caveat]
      properties:
        schema_version: {type: integer, const: 1}
        environment_id: {type: string}
        run_id: {type: string}
        snapshot_id: {type: string}
        snapshot_hash: {type: string}
        seed: {type: integer}
        config: {type: object}
        summary: {type: object}
        events: {type: array, items: {$ref: '#/components/schemas/SimulationEvent'}}
        run_created_at: {type: string, format: date-time}
        delivered_events: {type: integer}
        alert_count: {type: integer}
        alerts: {type: array, items: {$ref: '#/components/schemas/SecurityAlert'}}
        evidence_limit: {type: integer}
        caveat: {type: string}
    SOCSummary:
      type: object
      required: [telemetry_events, adversarial_events, detected_adversarial, alerts, active_rules, events_by_type, alerts_by_severity]
      properties:
        telemetry_events: {type: integer}
        adversarial_events: {type: integer}
        detected_adversarial: {type: integer}
        alerts: {type: integer}
        active_rules: {type: integer}
        events_by_type: {type: array, items: {$ref: '#/components/schemas/NamedCount'}}
        alerts_by_severity: {type: array, items: {$ref: '#/components/schemas/NamedCount'}}
    NamedCount:
      type: object
      required: [name, count]
      properties:
        name: {type: string}
        count: {type: integer}
    DefenseComparisonInput:
      allOf:
        - {$ref: '#/components/schemas/SimulationConfig'}
        - {type: object, required: [iterations, proposed_control_effectiveness, proposed_detection_coverage], properties: {iterations: {type: integer, minimum: 20, maximum: 1000}, proposed_control_effectiveness: {type: number, minimum: 0, maximum: 1}, proposed_detection_coverage: {type: number, minimum: 0, maximum: 1}}}
    DefenseComparison:
      type: object
      required: [iterations, seed, baseline, proposed, target_reached_delta, assumptions]
      properties:
        iterations: {type: integer}
        seed: {type: integer}
        baseline: {$ref: '#/components/schemas/DefenseOutcome'}
        proposed: {$ref: '#/components/schemas/DefenseOutcome'}
        target_reached_delta: {$ref: '#/components/schemas/EstimatedRate'}
        assumptions: {type: string}
    DefenseOutcome:
      type: object
      required: [target_reached, detected_run, mean_successful_transitions, mean_assets_affected, mean_elapsed_seconds, median_time_to_detection_seconds, median_time_to_target_seconds, p95_time_to_target_seconds]
      properties:
        target_reached: {$ref: '#/components/schemas/EstimatedRate'}
        detected_run: {$ref: '#/components/schemas/EstimatedRate'}
        mean_successful_transitions: {type: number}
        mean_assets_affected: {type: number}
        mean_elapsed_seconds: {type: number}
        median_time_to_detection_seconds: {type: [integer, 'null']}
        median_time_to_target_seconds: {type: [integer, 'null']}
        p95_time_to_target_seconds: {type: [integer, 'null']}
    EstimatedRate:
      type: object
      required: [estimate, ci95]
      properties:
        estimate: {type: number}
        ci95: {type: array, prefixItems: [{type: number}, {type: number}], minItems: 2, maxItems: 2}
    DetectionRuleInput:
      type: object
      required: [name, event_type, min_severity]
      properties:
        name: {type: string, minLength: 3, maxLength: 80}
        event_type: {type: string, enum: [scenario_started, suspicious_access_attempt, control_block, endpoint_alert, sensitive_resource_access, simulation_event]}
        min_severity: {type: integer, minimum: 1, maximum: 5}
        asset_id: {type: string, description: Optional exact synthetic asset ID.}
    DetectionRule:
      allOf:
        - {$ref: '#/components/schemas/DetectionRuleInput'}
        - {type: object, required: [id, environment_id, enabled, asset_id, created_by, created_at, updated_at], properties: {id: {type: string}, environment_id: {type: string}, enabled: {type: boolean}, created_by: {type: string}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    SecurityTelemetry:
      type: object
      required: [id, environment_id, job_id, run_id, source_event_id, sequence, schema_version, occurred_at_seconds, event_type, asset_id, source_asset_id, result, severity, detected, ground_truth, payload, created_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        job_id: {type: string}
        run_id: {type: string}
        source_event_id: {type: string}
        sequence: {type: integer, minimum: 1}
        schema_version: {type: integer, const: 1}
        occurred_at_seconds: {type: integer, minimum: 0}
        event_type: {type: string}
        asset_id: {type: string}
        source_asset_id: {type: string}
        result: {type: string}
        severity: {type: integer, minimum: 1, maximum: 5}
        detected: {type: boolean}
        ground_truth: {type: string, enum: [adversarial, control, scenario]}
        payload: {type: object, description: Source synthetic simulation event.}
        created_at: {type: string, format: date-time}
    SecurityAlert:
      type: object
      required: [id, environment_id, job_id, telemetry_id, rule_id, rule_name, event_type, asset_id, severity, created_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        job_id: {type: string}
        telemetry_id: {type: string}
        rule_id: {type: string}
        rule_name: {type: string}
        event_type: {type: string}
        asset_id: {type: string}
        severity: {type: integer, minimum: 1, maximum: 5}
        created_at: {type: string, format: date-time}
    SimulationJob:
      type: object
      required: [id, environment_id, run_id, status, event_cursor, total_events, speed, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        run_id: {type: string}
        status: {type: string, enum: [running, paused, stopped, completed]}
        event_cursor: {type: integer, minimum: 0}
        total_events: {type: integer, minimum: 0}
        speed: {type: number, enum: [0.5, 1, 2, 4]}
        events: {type: array, description: Events delivered through the current cursor., items: {$ref: '#/components/schemas/SimulationEvent'}}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SimulationConfig:
      type: object
      required: [snapshot_id, start_asset_id, target_asset_id, seed, duration_seconds, max_steps, detection_coverage, control_effectiveness]
      properties:
        snapshot_id: {type: string}
        start_asset_id: {type: string}
        target_asset_id: {type: string}
        seed: {type: integer, format: int64}
        duration_seconds: {type: integer, minimum: 10, maximum: 3600}
        max_steps: {type: integer, minimum: 1, maximum: 50}
        initial_capabilities: {type: array, maxItems: 4, items: {type: string, enum: [foothold, identity, operator, service_identity]}}
        detection_coverage: {type: number, minimum: 0, maximum: 1}
        control_effectiveness: {type: number, minimum: 0, maximum: 1}
    SimulationRun:
      type: object
      required: [id, environment_id, snapshot_id, seed, config, summary, created_by, created_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        snapshot_id: {type: string}
        seed: {type: integer, format: int64}
        config: {$ref: '#/components/schemas/SimulationConfig'}
        summary:
          type: object
          required: [result, end_asset_id, event_count, successful_transitions, detected_attempts, elapsed_seconds]
          properties:
            result: {type: string, enum: [target_reached, stalled, duration_exceeded, step_limit]}
            end_asset_id: {type: string}
            event_count: {type: integer}
            successful_transitions: {type: integer}
            detected_attempts: {type: integer}
            elapsed_seconds: {type: integer}
        events: {type: array, items: {$ref: '#/components/schemas/SimulationEvent'}}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    SimulationEvent:
      type: object
      required: [id, simulation_id, timestamp_seconds, source_asset_id, target_asset_id, event_type, preconditions, result, detected, severity, metadata]
      properties:
        id: {type: string}
        simulation_id: {type: string}
        timestamp_seconds: {type: integer}
        source_asset_id: {type: string}
        target_asset_id: {type: string}
        event_type: {type: string, enum: [simulation_started, transition_attempt, detection, target_reached]}
        transition_id: {type: [string, 'null']}
        technique_id: {type: [string, 'null'], description: No ATT&CK mapping is assigned in this slice.}
        preconditions: {type: object}
        result: {type: string}
        detected: {type: boolean}
        severity: {type: integer, minimum: 1, maximum: 5}
        metadata: {type: object}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    User:
      type: object
      required: [id, email]
      properties:
        id: {type: string}
        email: {type: string, format: email}
    Environment:
      type: object
      required: [id, organization_id, name, description, role, asset_count]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        description: {type: string}
        role: {type: string, enum: [viewer, editor, admin]}
        asset_count: {type: integer, minimum: 0}
    LayoutPosition:
      type: object
      required: [x, y]
      properties:
        x: {type: integer, minimum: -100000, maximum: 100000}
        y: {type: integer, minimum: -100000, maximum: 100000}
    GraphLayout:
      type: object
      required: [id, environment_id, name, positions, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        name: {type: string}
        positions:
          type: object
          additionalProperties: {$ref: '#/components/schemas/LayoutPosition'}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OrganizationUser:
      type: object
      required: [id, email, role]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [viewer, editor, admin]}
    AssetInput:
      type: object
      required: [name, type, segment, ip, criticality]
      properties:
        name: {type: string, minLength: 2, maxLength: 80}
        type: {type: string, enum: [workstation, identity, application, service_account, database, firewall, monitoring, server, router, cloud]}
        segment: {type: string, minLength: 2, maxLength: 40}
        ip: {type: string, description: RFC 1918 IPv4 address}
        criticality: {type: integer, minimum: 1, maximum: 5}
    Asset:
      allOf:
        - {$ref: '#/components/schemas/AssetInput'}
        - type: object
          required: [id, risk, x, y]
          properties:
            id: {type: string}
            risk: {type: integer, minimum: 0, maximum: 100}
            x: {type: integer}
            y: {type: integer}
    Edge:
      type: object
      required: [id, source, target, kind, likelihood]
      properties:
        id: {type: string}
        source: {type: string}
        target: {type: string}
        kind: {type: string}
        reason: {type: string}
        likelihood: {type: number, minimum: 0, maximum: 1}
        required_capability: {type: string}
        grants_capability: {type: string}
        required_relationship: {type: string}
        vulnerability_id: {type: string}
        blocked: {type: boolean}
    Graph:
      type: object
      required: [assets, edges]
      properties:
        assets: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        edges: {type: array, items: {$ref: '#/components/schemas/Edge'}}
    VulnerabilityInput:
      type: object
      required: [title, severity, cvss]
      properties:
        asset_id: {type: string}
        title: {type: string, minLength: 3, maxLength: 120}
        description: {type: string, maxLength: 1000}
        severity: {type: string, enum: [low, medium, high, critical]}
        cvss: {type: number, minimum: 0, maximum: 10}
        mitigation: {type: string, maxLength: 500}
        state: {type: string, enum: [active, mitigated], readOnly: true}
    VulnerabilityCreate:
      allOf:
        - {$ref: '#/components/schemas/VulnerabilityInput'}
        - type: object
          required: [asset_id]
          properties:
            asset_id: {type: string, minLength: 1}
    Vulnerability:
      allOf:
        - {$ref: '#/components/schemas/VulnerabilityInput'}
        - type: object
          required: [id, asset_id, state]
          properties:
            id: {type: string}
            asset_id: {type: string}
    Snapshot:
      type: object
      required: [id, environment_id, version, content_hash, created_by, created_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        version: {type: integer, minimum: 1}
        content_hash: {type: string}
        graph: {$ref: '#/components/schemas/Graph'}
        vulnerabilities: {type: array, items: {$ref: '#/components/schemas/Vulnerability'}}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    TransitionInput:
      type: object
      required: [source, target, reason, likelihood, required_capability, grants_capability, required_relationship, vulnerability_id]
      properties:
        source: {type: string}
        target: {type: string}
        reason: {type: string, minLength: 12, maxLength: 200}
        likelihood: {type: number, exclusiveMinimum: 0, maximum: 1}
        required_capability: {type: string, enum: [foothold, identity, operator, service_identity, data_access]}
        grants_capability: {type: string, enum: [foothold, identity, operator, service_identity, data_access]}
        required_relationship: {type: string, enum: [CAN_REACH, HAS_ACCESS_TO, TRUSTS, DEPENDS_ON]}
        vulnerability_id: {type: string}
    AttackPath:
      type: object
      required: [assets, steps, likelihood, impact, risk_score]
      properties:
        assets: {type: array, items: {type: string}}
        steps:
          type: array
          items:
            type: object
            required: [transition_id, source, target, reason, required_capability, grants_capability]
            properties:
              transition_id: {type: string}
              source: {type: string}
              target: {type: string}
              reason: {type: string}
              required_capability: {type: string}
              grants_capability: {type: string}
              vulnerability_id: {type: [string, 'null']}
        likelihood: {type: number, minimum: 0, maximum: 1}
        impact: {type: integer, minimum: 0}
        risk_score: {type: number, minimum: 0}
